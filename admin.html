<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Phong Mouse Gaming</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
}

h1 {
    text-align: center;
}

.box {
    background: #1f2937;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    opacity: .9;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.red {
    background: #ef4444;
    color: white;
}

.orange {
    background: #f59e0b;
}

.blue {
    background: #3b82f6;
    color: white;
}

.gray {
    background: #6b7280;
    color: white;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.product,
.order {
    background: #374151;
    padding: 18px;
    border-radius: 12px;
    margin-top: 12px;
}

.product img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    background: white;
    border-radius: 10px;
}

.price {
    color: #4ade80;
    font-size: 20px;
    font-weight: bold;
}

.code {
    color: #facc15;
    font-weight: bold;
}

.shipping {
    background: #172554;
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.error {
    color: #f87171;
    margin-top: 10px;
}

.success {
    color: #4ade80;
    margin-top: 10px;
}

#adminPanel {
    display: none;
}

@media (max-width: 750px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .top {
        display: block;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🔐 PHONG MOUSE ADMIN</h1>

<!-- ========================= -->
<!-- ĐĂNG NHẬP -->
<!-- ========================= -->

<div class="box" id="loginBox">

    <h2>Đăng nhập Admin</h2>

    <input
        id="email"
        type="email"
        placeholder="Email Admin">

    <input
        id="password"
        type="password"
        placeholder="Mật khẩu">

    <button id="loginButton">
        ĐĂNG NHẬP
    </button>

    <div id="loginError" class="error"></div>

</div>


<!-- ========================= -->
<!-- ADMIN PANEL -->
<!-- ========================= -->

<div id="adminPanel">

    <div class="box top">

        <div>
            <h2>⚙️ Trang quản trị</h2>
            <div id="adminEmail"></div>
        </div>

        <button
            id="logoutButton"
            class="red">
            ĐĂNG XUẤT
        </button>

    </div>


    <div class="grid">

        <!-- ========================= -->
        <!-- THÊM / SỬA SẢN PHẨM -->
        <!-- ========================= -->

        <div class="box">

            <h2 id="productFormTitle">
                🖱️ Thêm chuột
            </h2>

            <input
                id="productName"
                placeholder="Tên sản phẩm">

            <input
                id="productCode"
                placeholder="Mã sản phẩm, VD: ATK-X1">

            <input
                id="productPrice"
                type="number"
                min="0"
                placeholder="Giá, VD: 500000">

            <input
                id="productImage"
                type="url"
                placeholder="Link ảnh sản phẩm">

            <textarea
                id="productDescription"
                placeholder="Mô tả sản phẩm"></textarea>

            <button id="saveProduct">
                ➕ THÊM SẢN PHẨM
            </button>

            <button
                id="cancelEdit"
                class="gray"
                style="display:none;">
                HỦY SỬA
            </button>

            <div
                id="productMessage">
            </div>

        </div>


        <!-- ========================= -->
        <!-- DANH SÁCH SẢN PHẨM -->
        <!-- ========================= -->

        <div class="box">

            <h2>🖱️ Danh sách sản phẩm</h2>

            <div id="products">
                Đang tải...
            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- ĐƠN HÀNG -->
    <!-- ========================= -->

    <div class="box">

        <h2>📦 Quản lý đơn hàng</h2>

        <div id="orders">
            Đang tải đơn hàng...
        </div>

    </div>

</div>

</div>


<script type="module">

// ==================================================
// FIREBASE
// ==================================================

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    doc,
    setDoc,
    updateDoc,
    deleteDoc,
    onSnapshot,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


// ==================================================
// FIREBASE CONFIG
// ==================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyCKyvsdwOu2-cIYzVQA7bEBbUkfG1jQGlo",

    authDomain:
        "phong-mouse-gaming.firebaseapp.com",

    projectId:
        "phong-mouse-gaming",

    storageBucket:
        "phong-mouse-gaming.firebasestorage.app",

    messagingSenderId:
        "900019788297",

    appId:
        "1:900019788297:web:9dfb15fcae7e1e8291f6d8",

    measurementId:
        "G-MHRJYMFN8B"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const ADMIN_UID =
    "2z3xj2oNPpXSivcMR5wQJXzVgQK2";


let editingProductId = null;

let productsCache = {};


// ==================================================
// LOGIN
// ==================================================

document
.getElementById("loginButton")
.addEventListener("click", async () => {

    const email =
        document
        .getElementById("email")
        .value.trim();

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("loginError");

    error.textContent = "";

    try {

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        if (
            result.user.uid !== ADMIN_UID
        ) {

            await signOut(auth);

            error.textContent =
                "Tài khoản không có quyền Admin.";

        }

    } catch (err) {

        console.error(err);

        error.textContent =
            "Email hoặc mật khẩu không đúng.";

    }

});


// ==================================================
// AUTH STATE
// ==================================================

onAuthStateChanged(
    auth,
    async user => {

        if (
            user &&
            user.uid === ADMIN_UID
        ) {

            document
            .getElementById("loginBox")
            .style.display = "none";

            document
            .getElementById("adminPanel")
            .style.display = "block";

            document
            .getElementById("adminEmail")
            .textContent =
                "Đăng nhập: " + user.email;

            loadProducts();

            loadOrders();

        } else {

            document
            .getElementById("loginBox")
            .style.display = "block";

            document
            .getElementById("adminPanel")
            .style.display = "none";

        }

    }
);


// ==================================================
// LOGOUT
// ==================================================

document
.getElementById("logoutButton")
.addEventListener("click", async () => {

    await signOut(auth);

});


// ==================================================
// TẠO ID SẢN PHẨM AN TOÀN
// ==================================================

function productIdFromCode(code) {

    return code
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9_-]/g, "-");

}


// ==================================================
// THÊM / SỬA SẢN PHẨM
// ==================================================

document
.getElementById("saveProduct")
.addEventListener("click", async () => {

    const name =
        document
        .getElementById("productName")
        .value.trim();

    const code =
        document
        .getElementById("productCode")
        .value.trim().toUpperCase();

    const price =
        Number(
            document
            .getElementById("productPrice")
            .value
        );

    const image =
        document
        .getElementById("productImage")
        .value.trim();

    const description =
        document
        .getElementById("productDescription")
        .value.trim();

    const message =
        document
        .getElementById("productMessage");


    message.textContent = "";
    message.className = "";


    if (
        !name ||
        !code ||
        !Number.isFinite(price) ||
        price <= 0
    ) {

        message.textContent =
            "Nhập tên, mã và giá sản phẩm.";

        message.className =
            "error";

        return;

    }


    const productId =
        editingProductId ||
        productIdFromCode(code);


    try {

        await setDoc(

            doc(
                db,
                "products",
                productId
            ),

            {

                name: name,

                code: code,

                price: price,

                image: image,

                description:
                    description,

                active: true,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge: true
            }

        );


        message.textContent =
            editingProductId
            ? "✅ Đã cập nhật sản phẩm."
            : "✅ Đã thêm sản phẩm.";

        message.className =
            "success";


        clearProductForm();

    }

    catch (error) {

        console.error(error);

        message.textContent =
            "Không lưu được sản phẩm.";

        message.className =
            "error";

    }

});


// ==================================================
// LOAD PRODUCTS
// ==================================================

function loadProducts() {

    onSnapshot(

        collection(
            db,
            "products"
        ),

        snapshot => {

            const box =
                document
                .getElementById("products");

            box.innerHTML = "";

            productsCache = {};


            if (snapshot.empty) {

                box.textContent =
                    "Chưa có sản phẩm.";

                return;

            }


            snapshot.forEach(
                productDocument => {

                    const data =
                        productDocument.data();

                    productsCache[
                        productDocument.id
                    ] = data;


                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "product";


                    // Ảnh
                    if (data.image) {

                        const img =
                            document.createElement(
                                "img"
                            );

                        img.src =
                            data.image;

                        img.alt =
                            data.name || "Sản phẩm";

                        item.appendChild(img);

                    }


                    const name =
                        document.createElement(
                            "h3"
                        );

                    name.textContent =
                        data.name || "";

                    item.appendChild(name);


                    const code =
                        document.createElement(
                            "p"
                        );

                    code.textContent =
                        "Mã: " +
                        (data.code || "");

                    item.appendChild(code);


                    const price =
                        document.createElement(
                            "p"
                        );

                    price.className =
                        "price";

                    price.textContent =
                        Number(
                            data.price || 0
                        ).toLocaleString("vi-VN")
                        + "đ";

                    item.appendChild(price);


                    const status =
                        document.createElement(
                            "p"
                        );

                    status.textContent =
                        data.active === false
                        ? "🔴 Đang ẩn"
                        : "🟢 Đang bán";

                    item.appendChild(status);


                    const actions =
                        document.createElement(
                            "div"
                        );

                    actions.className =
                        "actions";


                    // SỬA
                    const editButton =
                        document.createElement(
                            "button"
                        );

                    editButton.className =
                        "blue";

                    editButton.textContent =
                        "✏️ SỬA";

                    editButton.onclick =
                        () => editProduct(
                            productDocument.id
                        );


                    // ẨN / HIỆN
                    const hideButton =
                        document.createElement(
                            "button"
                        );

                    hideButton.className =
                        "orange";

                    hideButton.textContent =
                        data.active === false
                        ? "👁️ HIỆN"
                        : "🙈 ẨN";

                    hideButton.onclick =
                        async () => {

                            await updateDoc(

                                doc(
                                    db,
                                    "products",
                                    productDocument.id
                                ),

                                {
                                    active:
                                        data.active === false
                                }

                            );

                        };


                    // XÓA
                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.className =
                        "red";

                    deleteButton.textContent =
                        "🗑️ XÓA";

                    deleteButton.onclick =
                        async () => {

                            const ok =
                                confirm(
                                    "Xóa sản phẩm " +
                                    data.name +
                                    "?"
                                );

                            if (!ok)
                                return;


                            await deleteDoc(

                                doc(
                                    db,
                                    "products",
                                    productDocument.id
                                )

                            );

                        };


                    actions.appendChild(
                        editButton
                    );

                    actions.appendChild(
                        hideButton
                    );

                    actions.appendChild(
                        deleteButton
                    );


                    item.appendChild(
                        actions
                    );


                    box.appendChild(
                        item
                    );

                }
            );

        }

    );

}


// ==================================================
// EDIT PRODUCT
// ==================================================

function editProduct(id) {

    const data =
        productsCache[id];

    if (!data)
        return;


    editingProductId =
        id;


    document
    .getElementById("productName")
    .value =
        data.name || "";


    document
    .getElementById("productCode")
    .value =
        data.code || "";


    document
    .getElementById("productPrice")
    .value =
        data.price || "";


    document
    .getElementById("productImage")
    .value =
        data.image || "";


    document
    .getElementById("productDescription")
    .value =
        data.description || "";


    document
    .getElementById("productFormTitle")
    .textContent =
        "✏️ Sửa sản phẩm";


    document
    .getElementById("saveProduct")
    .textContent =
        "💾 LƯU THAY ĐỔI";


    document
    .getElementById("cancelEdit")
    .style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ==================================================
// HỦY EDIT
// ==================================================

document
.getElementById("cancelEdit")
.addEventListener(
    "click",
    clearProductForm
);


function clearProductForm() {

    editingProductId =
        null;


    document
    .getElementById("productName")
    .value = "";


    document
    .getElementById("productCode")
    .value = "";


    document
    .getElementById("productPrice")
    .value = "";


    document
    .getElementById("productImage")
    .value = "";


    document
    .getElementById("productDescription")
    .value = "";


    document
    .getElementById("productFormTitle")
    .textContent =
        "🖱️ Thêm chuột";


    document
    .getElementById("saveProduct")
    .textContent =
        "➕ THÊM SẢN PHẨM";


    document
    .getElementById("cancelEdit")
    .style.display =
        "none";

}


// ==================================================
// LOAD ORDERS
// ==================================================

function loadOrders() {

    onSnapshot(

        collection(
            db,
            "orders"
        ),

        snapshot => {

            const box =
                document
                .getElementById("orders");

            box.innerHTML = "";


            if (snapshot.empty) {

                box.textContent =
                    "Chưa có đơn hàng.";

                return;

            }


            snapshot.forEach(
                orderDocument => {

                    const data =
                        orderDocument.data();


                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "order";


                    const title =
                        document.createElement(
                            "h3"
                        );

                    title.textContent =
                        "Đơn: " +
                        (
                            data.orderCode ||
                            orderDocument.id
                        );

                    item.appendChild(
                        title
                    );


                    const product =
                        document.createElement(
                            "p"
                        );

                    product.textContent =
                        "Sản phẩm: " +
                        (data.productName || "");

                    item.appendChild(
                        product
                    );


                    const price =
                        document.createElement(
                            "p"
                        );

                    price.textContent =
                        "Giá: " +
                        Number(
                            data.price || 0
                        ).toLocaleString(
                            "vi-VN"
                        )
                        + "đ";

                    item.appendChild(
                        price
                    );


                    const status =
                        document.createElement(
                            "p"
                        );

                    status.textContent =
                        "Trạng thái: " +
                        statusText(
                            data.status
                        );

                    item.appendChild(
                        status
                    );


                    // CHỜ TIỀN
                    if (
                        data.status ===
                        "waiting_payment"
                    ) {

                        const confirmButton =
                            document.createElement(
                                "button"
                            );

                        confirmButton.textContent =
                            "✅ XÁC NHẬN ĐÃ NHẬN TIỀN";


                        confirmButton.onclick =
                            async () => {

                                const ok =
                                    confirm(
                                        "Chỉ xác nhận sau khi m đã kiểm tra MB Bank và nhận đúng số tiền cho đơn " +
                                        data.orderCode +
                                        ". Xác nhận?"
                                    );


                                if (!ok)
                                    return;


                                confirmButton.disabled =
                                    true;


                                try {

                                    await updateDoc(

                                        doc(
                                            db,
                                            "orders",
                                            orderDocument.id
                                        ),

                                        {

                                            status:
                                                "paid",

                                            paidAt:
                                                serverTimestamp()

                                        }

                                    );

                                }

                                catch (error) {

                                    console.error(
                                        error
                                    );

                                    alert(
                                        "Không cập nhật được đơn."
                                    );

                                    confirmButton.disabled =
                                        false;

                                }

                            };


                        item.appendChild(
                            confirmButton
                        );

                    }


                    // ĐÃ NHẬN TIỀN
                    if (
                        data.status ===
                        "paid"
                    ) {

                        const text =
                            document.createElement(
                                "p"
                            );

                        text.textContent =
                            "✅ Đã nhận tiền. Đang chờ khách gửi thông tin nhận hàng.";

                        item.appendChild(
                            text
                        );

                    }


                    // THÔNG TIN GIAO HÀNG
                    if (
                        data.status ===
                        "shipping_info_submitted"
                    ) {

                        const shipping =
                            document.createElement(
                                "div"
                            );

                        shipping.className =
                            "shipping";


                        const heading =
                            document.createElement(
                                "h3"
                            );

                        heading.textContent =
                            "🚚 THÔNG TIN NHẬN HÀNG";


                        const name =
                            document.createElement(
                                "p"
                            );

                        name.textContent =
                            "Họ tên: " +
                            (data.customerName || "");


                        const phone =
                            document.createElement(
                                "p"
                            );

                        phone.textContent =
                            "SĐT: " +
                            (data.phone || "");


                        const address =
                            document.createElement(
                                "p"
                            );

                        address.textContent =
                            "Địa chỉ: " +
                            (data.address || "");


                        shipping.appendChild(
                            heading
                        );

                        shipping.appendChild(
                            name
                        );

                        shipping.appendChild(
                            phone
                        );

                        shipping.appendChild(
                            address
                        );


                        item.appendChild(
                            shipping
                        );

                    }


                    box.appendChild(
                        item
                    );

                }
            );

        },

        error => {

            console.error(error);

            document
            .getElementById("orders")
            .textContent =
                "Không tải được đơn hàng.";

        }

    );

}


// ==================================================
// STATUS
// ==================================================

function statusText(status) {

    if (
        status ===
        "waiting_payment"
    )
        return "⏳ Chờ thanh toán";


    if (
        status ===
        "paid"
    )
        return "✅ Đã thanh toán";


    if (
        status ===
        "shipping_info_submitted"
    )
        return "📦 Đã nhận thông tin giao hàng";


    return status || "Không xác định";

}

</script>

</body>
</html>
